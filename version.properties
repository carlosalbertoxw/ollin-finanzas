# La version de Ollin Finanzas, en un solo lugar.
#
# De aqui salen el versionName y el versionCode del APK, y contra esto compara
# el flujo de release el tag que lo disparo: publicar v1.2.0 con este archivo
# en 1.1.0 aborta antes de compilar nada.
#
# versionCode = mayor * 10000 + menor * 100 + parche, asi que menor y parche
# tienen que quedarse por debajo de 100. Google Play solo exige que el numero
# suba en cada publicacion; esta forma ademas deja leer la version a simple
# vista.
versionMayor=1
versionMenor=0
versionParche=0
