<!doctype html>
<!--
  Imagen destacada de la ficha de Play, 1024x500. Play la recorta y le pone
  encima el boton de reproducir si hay video, asi que lo importante va en el
  centro y lejos de las orillas. Colores del sitio (web/src/estilo.css).
  Se regenera con genera.sh.
-->
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=block">
<style>
  :root {
    --obsidiana: #12181b;
    --obsidiana-clara: #242e33;
    --jade: #2f9e6e;
    --jade-claro: #6fcfa1;
    --cempasuchil: #e9a13b;
    --papel: #f7f5f0;
    --tenue: #9aa5a1;
  }
  html, body { margin: 0; }
  body {
    width: 1024px;
    height: 500px;
    overflow: hidden;
    background:
      radial-gradient(circle at 30% 50%, rgba(233, 161, 59, 0.10), transparent 42%),
      var(--obsidiana);
    font-family: Roboto, 'Segoe UI', sans-serif;
    color: var(--papel);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 56px;
  }
  svg { width: 260px; height: 260px; flex: none; }
  h1 { margin: 0; font-size: 66px; font-weight: 700; letter-spacing: -1px; line-height: 1; }
  h1 span { color: var(--cempasuchil); }
  p { margin: 18px 0 0; font-size: 32px; color: var(--tenue); }
  ul {
    display: flex;
    gap: 10px;
    margin: 30px 0 0;
    padding: 0;
    list-style: none;
  }
  li {
    font-size: 19px;
    font-weight: 500;
    color: var(--jade-claro);
    border: 1.5px solid rgba(111, 207, 161, 0.35);
    border-radius: 999px;
    padding: 7px 16px;
  }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="14 14 80 80" aria-hidden="true">
  <path fill="#2F9E6E" d="M54,54 C58,38 72,24 90,18 C84,36 70,50 54,54 Z" />
  <path fill="#2F9E6E" d="M54,54 C50,70 36,84 18,90 C24,72 38,58 54,54 Z" />
  <path fill="#C4453F" d="M54,54 C50,38 36,24 18,18 C24,36 38,50 54,54 Z" />
  <path fill="#C4453F" d="M54,54 C58,70 72,84 90,90 C84,72 70,58 54,54 Z" />
  <circle fill="#E9A13B" cx="54" cy="54" r="10" />
</svg>
<div>
  <h1>Ollin <span>Finanzas</span></h1>
  <p>El libro de tus movimientos.</p>
  <ul>
    <li>Sin cuentas</li>
    <li>Sin nube</li>
    <li>Sin publicidad</li>
  </ul>
</div>
</body>
</html>
