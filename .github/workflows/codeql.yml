# Analisis estatico de seguridad del codigo de la app.
#
# Busca los patrones que una revision a ojo deja pasar: rutas de archivo
# armadas con datos de fuera, intents con destino variable, criptografia mal
# usada. No bloquea por si solo; los hallazgos aparecen en la pestana Security
# del repositorio y en el propio pull request.
#
# Va en un flujo aparte y no dentro de pruebas.yml porque necesita su propia
# compilacion instrumentada, que es mas lenta, y porque su permiso de escribir
# eventos de seguridad no tiene por que tenerlo nadie mas.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Lunes a las 7:00 UTC, despues de las pruebas semanales.
    - cron: '0 7 * * 1'

permissions:
  contents: read

jobs:
  analizar:
    name: Analizar Kotlin
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Preparar CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: java-kotlin
          build-mode: manual

      # Kotlin no se puede analizar sin compilar: CodeQL observa al compilador.
      # Sin cache de build y repitiendo las tareas, para que vea compilar todo.
      - name: Compilar
        run: ./gradlew :app:compileDebugKotlin --no-daemon --no-build-cache --rerun-tasks

      - name: Analizar
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: '/language:java-kotlin'
