# La suite de interfaz, sobre un emulador.
#
# No corre en cada push a proposito. Levantar un emulador cuesta unos diez
# minutos y las de interfaz dependen de animaciones, dialogos y relojes: su
# intermitencia acabaria enseñando a ignorar el aspa roja, que es peor que no
# tenerlas. Van una vez por semana y a mano cuando se ha tocado una pantalla.
#
# La prueba de actualizacion se mudo a su propio flujo el dia que empezo a
# bloquear una publicacion. Ver .github/workflows/actualizacion.yml. Las de
# migracion corren aqui con las demas, y ademas, solas y bloqueando, en el flujo
# de publicacion.
name: Pruebas de interfaz

on:
  workflow_dispatch:
  schedule:
    # Lunes a las 6:00 UTC, medianoche en el centro de Mexico.
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  interfaz:
    name: Compose UI Test
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        # El minSdk y una version reciente: entre esas dos cambian los permisos
        # de notificaciones y el dialogo de credencial del sistema, que es
        # justo lo que estas pruebas recorren.
        api-level: [26, 34]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # La imagen del emulador se descarga con reintentos antes de arrancarlo.
      # Una descarga corrupta ("Error on ZipFile unknown archive") dejaba el
      # emulador sin arrancar y el job en rojo sin haber corrido una prueba:
      # paso el 12 de octubre de 2026 en Pruebas de interfaz de Finanzas, API 26.
      # Con la imagen ya instalada, el sdkmanager del action no vuelve a bajarla.
      - name: Descargar la imagen del emulador
        env:
          IMAGEN: system-images;android-${{ matrix.api-level }};google_apis;x86_64
        run: |
          set -uo pipefail
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # "system-images;android-34;google_apis;x86_64" vive en esa misma ruta.
          destino="$ANDROID_HOME/${IMAGEN//;//}"
          registro="$RUNNER_TEMP/descarga-imagen.log"
          for intento in 1 2 3; do
            # Lo que decide es que la imagen quede en disco, no el codigo de la
            # tuberia: `yes` muere con "Broken pipe" en cuanto sdkmanager deja de
            # leer, y con pipefail eso tumbaba el paso con la imagen ya bajada.
            # cmdline-tools 23 convierte a sdkmanager en la CLI `android`, que
            # lista los paquetes con "/": si el nombre con ";" no la trae, se pide asi.
            for nombre in "$IMAGEN" "${IMAGEN//;//}"; do
              { yes 2>/dev/null || true; } | "$sdk" --install "$nombre" --channel=0 > "$registro" 2>&1 || true
              if [ -f "$destino/source.properties" ] || [ -f "$destino/package.xml" ]; then
                echo "Imagen lista en el intento $intento."
                exit 0
              fi
            done
            echo "::warning::La descarga de $IMAGEN fallo (intento $intento); se reintenta."
            tail -n 20 "$registro"
            rm -rf "$destino" "$HOME/.android/cache"
            sleep 15
          done
          echo "::error::No se pudo descargar $IMAGEN tras tres intentos."
          exit 1

      - name: Correr la suite
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          # Sin perfil el emulador arranca en 320x640, mas chico que cualquier
          # telefono: lo que queda abajo de una lista perezosa no se compone y
          # las pruebas no lo encuentran.
          profile: pixel_6
          # `lenient`: el ejecutor de pruebas en dispositivo (UTP) se descarga
          # solo con un emulador conectado, y por eso no esta en
          # gradle/verification-metadata.xml. Aqui un checksum que no cuadre se
          # avisa en vez de cortar: este job no produce nada que se publique.
          # Lo que se firma y publica sigue verificado en estricto.
          script: ./gradlew connectedDebugAndroidTest --dependency-verification=lenient --no-daemon

      - name: Guardar el informe
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: informe-interfaz-api${{ matrix.api-level }}
          path: app/build/reports/androidTests/
          retention-days: 14
          if-no-files-found: ignore
