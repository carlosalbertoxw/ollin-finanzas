# La suite de interfaz, sobre un emulador.
#
# No corre en cada push a proposito. Levantar un emulador cuesta unos diez
# minutos y estas pruebas dependen de animaciones, dialogos y relojes: su
# intermitencia acabaria enseñando a ignorar el aspa roja, que es peor que no
# tenerlas. Van una vez por semana y a mano cuando se ha tocado una pantalla.
#
# Las de migracion no estan aqui: esas si bloquean una publicacion, y viven en
# el flujo de publicacion. Ver .github/workflows/publicacion.yml.
name: Pruebas de interfaz

on:
  workflow_dispatch:
  schedule:
    # Lunes a las 6:00 UTC, medianoche en el centro de Mexico.
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  interfaz:
    name: Compose UI Test
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        # El minSdk y una version reciente: entre esas dos cambian los permisos
        # de notificaciones y el dialogo de credencial del sistema, que es
        # justo lo que estas pruebas recorren.
        api-level: [26, 34]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Correr la suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --no-daemon

      - name: Guardar el informe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-interfaz-api${{ matrix.api-level }}
          path: app/build/reports/androidTests/
          retention-days: 14
          if-no-files-found: ignore
