# La suite de interfaz, sobre un emulador.
#
# No corre en cada push a proposito. Levantar un emulador cuesta unos diez
# minutos y las de interfaz dependen de animaciones, dialogos y relojes: su
# intermitencia acabaria enseñando a ignorar el aspa roja, que es peor que no
# tenerlas. Van una vez por semana y a mano cuando se ha tocado una pantalla.
#
# La prueba de actualizacion se mudo a su propio flujo el dia que empezo a
# bloquear una publicacion. Ver .github/workflows/actualizacion.yml.
name: Pruebas de interfaz

on:
  workflow_dispatch:
  schedule:
    # Lunes a las 6:00 UTC, medianoche en el centro de Mexico.
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  interfaz:
    name: Compose UI Test
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        # El minSdk y una version reciente: entre esas dos cambian los permisos
        # de notificaciones y el dialogo de credencial del sistema, que es
        # justo lo que estas pruebas recorren.
        api-level: [26, 34]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Correr la suite
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --no-daemon

      - name: Guardar el informe
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: informe-interfaz-api${{ matrix.api-level }}
          path: app/build/reports/androidTests/
          retention-days: 14
          if-no-files-found: ignore
