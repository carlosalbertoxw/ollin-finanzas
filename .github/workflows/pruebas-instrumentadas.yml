# La suite de interfaz, sobre un emulador.
#
# No corre en cada push a proposito. Levantar un emulador cuesta unos diez
# minutos y las de interfaz dependen de animaciones, dialogos y relojes: su
# intermitencia acabaria enseñando a ignorar el aspa roja, que es peor que no
# tenerlas. Van una vez por semana y a mano cuando se ha tocado una pantalla.
#
# La prueba de actualizacion se mudo a su propio flujo el dia que empezo a
# bloquear una publicacion. Ver .github/workflows/actualizacion.yml.
name: Pruebas de interfaz

on:
  workflow_dispatch:
  schedule:
    # Lunes a las 6:00 UTC, medianoche en el centro de Mexico.
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  interfaz:
    name: Compose UI Test
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        # El minSdk y una version reciente: entre esas dos cambian los permisos
        # de notificaciones y el dialogo de credencial del sistema, que es
        # justo lo que estas pruebas recorren.
        api-level: [26, 34]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Correr la suite
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --no-daemon

      - name: Guardar el informe
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: informe-interfaz-api${{ matrix.api-level }}
          path: app/build/reports/androidTests/
          retention-days: 14
          if-no-files-found: ignore
