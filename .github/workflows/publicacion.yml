# Publica una version: la etiqueta manda, el CHANGELOG explica.
#
#   git tag -a v1.1.0 -m "Ollin Finanzas 1.1.0"
#   git push origin v1.1.0
#
# A partir de ahi, sin tocar nada mas: se comprueba que la etiqueta coincide con
# la version que encabeza el CHANGELOG, se pasan las pruebas, se compila el APK
# firmado, se crea la release con las notas de esa version y se vuelve a
# desplegar el sitio para que anuncie la descarga nueva.
#
# El orden no es negociable. Publicar primero y comprobar despues significa que
# alguien puede instalar un artefacto que no pasa las pruebas antes de que nadie
# se entere, y una version retirada de GitHub sigue instalada en su telefono.
name: Publicación

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Lo barato primero: si la etiqueta y el CHANGELOG no cuadran, no vale la pena
  # gastar veinte minutos de compilacion para descubrirlo al final.
  # ---------------------------------------------------------------------------
  etiqueta:
    name: Comprobar la etiqueta
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      version: ${{ steps.leer.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: La etiqueta tiene que encabezar el CHANGELOG
        id: leer
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"

          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::La etiqueta '$GITHUB_REF_NAME' no es un vX.Y.Z."
            exit 1
          fi

          # La primera version del archivo, que es de la que el build de la app
          # saca su versionName. Si no fuera esta, el APK saldria etiquetado con
          # un numero distinto del de la release: la confusion mas cara posible.
          encabeza=$(grep -oPm1 '^## \[\K[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md || true)

          if [ "$encabeza" != "$version" ]; then
            echo "::error::La etiqueta dice $version y el CHANGELOG encabeza con '${encabeza:-nada}'."
            echo "::error::Renombra la sección [Sin publicar] a [$version] y vuelve a etiquetar."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publicando la $version."

      - name: Extraer las notas de la versión
        run: |
          set -euo pipefail
          version="${{ steps.leer.outputs.version }}"

          # De su encabezado hasta el siguiente `## `, sin las referencias de
          # enlace del final del archivo, que son fontaneria de Markdown.
          #
          # Se compara con index() y no con una expresion regular a proposito:
          # el numero de version lleva puntos y va entre corchetes, asi que
          # interpolarlo en un patron lo convertiria en una clase de caracteres
          # —[1.0.0] casa con "1", "." y "0"— y ademas obliga a un baile de
          # barras que no sobrevive a pasar por YAML y por el shell.
          awk -v v="$version" '
            BEGIN { encabezado = "## [" v "]" }
            index($0, encabezado) == 1 { dentro = 1; next }
            dentro && index($0, "## ") == 1 { exit }
            dentro { print }
          ' CHANGELOG.md > crudo.md

          # Fuera las referencias de enlace y las lineas en blanco del final.
          grep -vE '^\[[^]]+\]:[[:space:]]*[^[:space:]]+$' crudo.md \
            | awk 'NF { ultima = NR } { linea[NR] = $0 } END { for (i = 1; i <= ultima; i++) print linea[i] }' \
            > notas.md
          rm -f crudo.md

          if [ ! -s notas.md ]; then
            echo "::error::La sección [$version] del CHANGELOG está vacía."
            exit 1
          fi

          echo "--- notas de la $version ---"
          cat notas.md

      - name: Guardar las notas para el paso de publicar
        uses: actions/upload-artifact@v4
        with:
          name: notas-de-version
          path: notas.md
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Exactamente las mismas pruebas que corren en cualquier pull request. Se
  # invoca el flujo en vez de copiar los pasos para que no puedan divergir.
  # ---------------------------------------------------------------------------
  pruebas:
    name: Pruebas
    needs: etiqueta
    uses: ./.github/workflows/pruebas.yml

  # ---------------------------------------------------------------------------
  # Aqui va el job de migraciones en emulador, y todavia no existe porque no hay
  # ninguna que correr: el esquema sigue en su version inicial. En cuanto se
  # escriba la primera Migration entra aqui una `MigracionesTest` sobre un
  # emulador de verdad, bloqueando la publicacion, porque una migracion
  # equivocada deja la app sin abrir en el telefono de quien actualiza y no hay
  # forma de arreglarlo desde fuera. Mientras tanto, EsquemaDeBaseTest vigila en
  # la JVM que la cadena no tenga huecos. Ver docs/modelo-de-datos.md.
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # El artefacto firmado y la release.
  # ---------------------------------------------------------------------------
  publicar:
    name: Compilar y publicar
    needs: [etiqueta, pruebas]
    runs-on: ubuntu-latest
    timeout-minutes: 40

    permissions:
      contents: write

    env:
      VERSION: ${{ needs.etiqueta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/download-artifact@v4
        with:
          name: notas-de-version

      # El almacen de claves viaja como secreto en base64 porque un secreto de
      # Actions es texto y un .jks es binario. Se escribe fuera del arbol de
      # trabajo para que no pueda acabar en un artefacto por descuido.
      #
      # Los cuatro secretos se comprueban aqui, juntos y antes de compilar. Un
      # secreto ausente es la cadena vacia, no un error: si se deja pasar, el
      # build tarda dos minutos en morir dentro de AGP con un NullPointer que
      # no nombra el secreto ni dice que falta uno. Y se listan todos los que
      # falten de una vez, para arreglarlos en un viaje y no en cuatro.
      - name: Restaurar el almacén de claves
        env:
          ALMACEN: ${{ secrets.OLLIN_FINANZAS_KEYSTORE_BASE64 }}
          OLLIN_FINANZAS_STORE_PASSWORD: ${{ secrets.OLLIN_FINANZAS_STORE_PASSWORD }}
          ALIAS: ${{ secrets.OLLIN_FINANZAS_KEY_ALIAS }}
          CLAVE: ${{ secrets.OLLIN_FINANZAS_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          faltan=()
          [ -n "${ALMACEN:-}" ] || faltan+=("OLLIN_FINANZAS_KEYSTORE_BASE64")
          [ -n "${OLLIN_FINANZAS_STORE_PASSWORD:-}" ] || faltan+=("OLLIN_FINANZAS_STORE_PASSWORD")
          [ -n "${ALIAS:-}" ] || faltan+=("OLLIN_FINANZAS_KEY_ALIAS")
          [ -n "${CLAVE:-}" ] || faltan+=("OLLIN_FINANZAS_KEY_PASSWORD")

          if [ ${#faltan[@]} -gt 0 ]; then
            echo "::error::Faltan estos secretos del repositorio: ${faltan[*]}"
            echo "::error::Sin ellos el APK saldría sin firmar y no se instala en ningún teléfono."
            echo "::error::Van en Settings → Secrets and variables → Actions, como secretos del"
            echo "::error::repositorio y no de un entorno. Los nombres van tal cual. Ver docs/publicacion.md."
            exit 1
          fi

          almacen="$RUNNER_TEMP/ollin-finanzas-release.jks"
          printf '%s' "$ALMACEN" | base64 --decode > "$almacen"

          # Que el archivo sea un almacen de verdad, que la contrasena lo abra y
          # que el alias exista: las tres cosas en un segundo, contra los dos
          # minutos que tarda R8 en llegar al momento de firmar y descubrirlo.
          # La contrasena va por `:env` y nunca por la linea de comandos.
          if ! keytool -list -keystore "$almacen" \
                 -storepass:env OLLIN_FINANZAS_STORE_PASSWORD \
                 -alias "$ALIAS" > /dev/null 2>&1; then
            echo "::error::El almacén no se pudo abrir con el alias '$ALIAS'."
            echo "::error::O el base64 no corresponde al .jks, o STORE_PASSWORD no es la suya,"
            echo "::error::o el alias está mal escrito. Compruébalo en local con:"
            echo "::error::  ./gradlew :app:signingReport"
            exit 1
          fi

          echo "Almacén restaurado y comprobado, alias '$ALIAS'."

      - name: Compilar el APK y el bundle
        env:
          OLLIN_FINANZAS_STORE_FILE: ${{ runner.temp }}/ollin-finanzas-release.jks
          OLLIN_FINANZAS_STORE_PASSWORD: ${{ secrets.OLLIN_FINANZAS_STORE_PASSWORD }}
          OLLIN_FINANZAS_KEY_ALIAS: ${{ secrets.OLLIN_FINANZAS_KEY_ALIAS }}
          OLLIN_FINANZAS_KEY_PASSWORD: ${{ secrets.OLLIN_FINANZAS_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      # Sin credenciales el build no falla, saca `app-release-unsigned.apk` y
      # sigue adelante. Es lo que se quiere al compilar en local; aqui seria un
      # desastre silencioso, asi que se comprueba la firma antes de publicar.
      - name: Comprobar que el APK va firmado
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk

          if [ ! -f "$apk" ]; then
            echo "::error::No hay app-release.apk. ¿Salió sin firmar?"
            ls -la app/build/outputs/apk/release/ || true
            exit 1
          fi

          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "$apk"

      # Se adjunta el APK y nada mas. El .aab se compila —un fallo de bundling
      # es un fallo igual y conviene verlo aqui— pero no se publica: no se
      # instala en ningun telefono, solo sirve para subirlo a Play, y una
      # descarga que no hace lo que promete confunde a quien llega de fuera.
      - name: Preparar la entrega
        run: |
          set -euo pipefail
          mkdir -p entrega
          cp app/build/outputs/apk/release/app-release.apk "entrega/ollin-finanzas-$VERSION.apk"

          # La huella se publica junto al archivo para que cualquiera pueda
          # comprobar que lo que bajo es lo que salio de esta compilacion.
          ( cd entrega && sha256sum ./*.apk > checksums.txt )
          cat entrega/checksums.txt

      - name: Crear la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --title "Ollin Finanzas $VERSION" \
            --notes-file notas.md \
            --verify-tag \
            entrega/*

  # ---------------------------------------------------------------------------
  # Y el sitio, al final: le pregunta a GitHub por la release recien creada, le
  # saca la huella al APK publicado y reescribe el version.json que consultan
  # las instalaciones que ya estan por ahi.
  #
  # Se lanza sobre main en vez de invocarlo desde aqui, por dos razones que
  # apuntan al mismo sitio.
  #
  # La practica: el entorno github-pages solo admite despliegues desde la rama
  # por omision. Invocado desde aqui, el flujo corre en el ref de la etiqueta y
  # GitHub lo rechaza con "not allowed to deploy to github-pages".
  #
  # La de fondo: el contenido del sitio —el HTML, los estilos, los textos— debe
  # salir de main y no del arbol al que apunte una etiqueta. Si no, relanzar la
  # publicacion de una version vieja republicaria el sitio de entonces y se
  # llevaria por delante cualquier correccion posterior. Los datos de la
  # descarga no viajan por aqui: sitio.yml le pregunta a GitHub cual es la
  # ultima release, asi que lanzarlo sobre main publica exactamente lo mismo.
  # ---------------------------------------------------------------------------
  sitio:
    name: Lanzar el despliegue del sitio
    needs: publicar
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      actions: write

    steps:
      - uses: actions/checkout@v4

      - name: Desplegar desde main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run sitio.yml --ref main
          echo "Despliegue lanzado. Corre aparte, aqui no se espera:"
          echo "  $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/workflows/sitio.yml"
