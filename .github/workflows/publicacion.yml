# Publica una version: la etiqueta manda, el CHANGELOG explica.
#
#   git tag -a v1.1.0 -m "Ollin Finanzas 1.1.0"
#   git push origin v1.1.0
#
# A partir de ahi, sin tocar nada mas: se comprueba que la etiqueta coincide con
# la version que encabeza el CHANGELOG, se pasan las pruebas, se compila el APK
# firmado, se crea la release con las notas de esa version y se vuelve a
# desplegar el sitio para que anuncie la descarga nueva.
#
# El orden no es negociable. Publicar primero y comprobar despues significa que
# alguien puede instalar un artefacto que no pasa las pruebas antes de que nadie
# se entere, y una version retirada de GitHub sigue instalada en su telefono.
name: Publicación

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Lo barato primero: si la etiqueta y el CHANGELOG no cuadran, no vale la pena
  # gastar veinte minutos de compilacion para descubrirlo al final.
  # ---------------------------------------------------------------------------
  etiqueta:
    name: Comprobar la etiqueta
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      version: ${{ steps.leer.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: La etiqueta tiene que encabezar el CHANGELOG
        id: leer
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"

          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::La etiqueta '$GITHUB_REF_NAME' no es un vX.Y.Z."
            exit 1
          fi

          # El versionCode se arma con huecos de dos cifras (1.2.3 -> 10203; ver
          # app/build.gradle.kts). Una 1.100.0 daria 20000, el mismo codigo que
          # la 2.0.0, y Android se negaria a instalar la segunda encima de la
          # primera; una 1.2.100 chocaria igual con la 1.3.0. Mejor saberlo aqui.
          IFS=. read -r _ menor parche <<< "$version"
          if [ "$((10#$menor))" -gt 99 ] || [ "$((10#$parche))" -gt 99 ]; then
            echo "::error::La versión menor y el parche no pueden pasar de 99: el versionCode dejaría de crecer."
            echo "::error::Sube la versión mayor, o cambia la fórmula del versionCode en app/build.gradle.kts."
            exit 1
          fi

          # La primera version del archivo, que es de la que el build de la app
          # saca su versionName. Si no fuera esta, el APK saldria etiquetado con
          # un numero distinto del de la release: la confusion mas cara posible.
          encabeza=$(grep -oPm1 '^## \[\K[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md || true)

          if [ "$encabeza" != "$version" ]; then
            echo "::error::La etiqueta dice $version y el CHANGELOG encabeza con '${encabeza:-nada}'."
            echo "::error::Renombra la sección [Sin publicar] a [$version] y vuelve a etiquetar."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publicando la $version."

      - name: Extraer las notas de la versión
        run: |
          set -euo pipefail
          version="${{ steps.leer.outputs.version }}"

          # De su encabezado hasta el siguiente `## `, sin las referencias de
          # enlace del final del archivo, que son fontaneria de Markdown.
          #
          # Se compara con index() y no con una expresion regular a proposito:
          # el numero de version lleva puntos y va entre corchetes, asi que
          # interpolarlo en un patron lo convertiria en una clase de caracteres
          # —[1.0.0] casa con "1", "." y "0"— y ademas obliga a un baile de
          # barras que no sobrevive a pasar por YAML y por el shell.
          awk -v v="$version" '
            BEGIN { encabezado = "## [" v "]" }
            index($0, encabezado) == 1 { dentro = 1; next }
            dentro && index($0, "## ") == 1 { exit }
            dentro { print }
          ' CHANGELOG.md > crudo.md

          # Fuera las referencias de enlace y las lineas en blanco del final.
          grep -vE '^\[[^]]+\]:[[:space:]]*[^[:space:]]+$' crudo.md \
            | awk 'NF { ultima = NR } { linea[NR] = $0 } END { for (i = 1; i <= ultima; i++) print linea[i] }' \
            > notas.md
          rm -f crudo.md

          if [ ! -s notas.md ]; then
            echo "::error::La sección [$version] del CHANGELOG está vacía."
            exit 1
          fi

          echo "--- notas de la $version ---"
          cat notas.md

      - name: Guardar las notas para el paso de publicar
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: notas-de-version
          path: notas.md
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Exactamente las mismas pruebas que corren en cualquier pull request. Se
  # invoca el flujo en vez de copiar los pasos para que no puedan divergir.
  # ---------------------------------------------------------------------------
  pruebas:
    name: Pruebas
    needs: etiqueta
    uses: ./.github/workflows/pruebas.yml

  # ---------------------------------------------------------------------------
  # Que la version nueva abra encima de la anterior, que es lo que rompio la
  # 1.0.1. Bloquea, en el mismo grupo que las migraciones: un fallo asi deja sin
  # app a toda la gente que actualizo y no se arregla desde fuera.
  #
  # Estuvo fuera de aqui del 3 al 9 de septiembre de 2026. Bloqueando dio tres
  # falsos negativos seguidos contra la 1.0.3, y un trabajo que no bloquea
  # tampoco cabia: un `uses:` no admite `continue-on-error`, asi que su fallo
  # pintaba de rojo publicaciones que habian salido bien. Los tres eran del
  # andamiaje --el script moria en silencio, `am start` entregaba el intent a
  # una tarea fantasma, y el dialogo de avisos tapaba el arranque-- y con ellos
  # arreglados paso en verde contra la 1.0.3, que es la condicion que se habia
  # puesto para devolverla aqui.
  # ---------------------------------------------------------------------------
  actualizacion:
    name: Actualizacion
    needs: etiqueta
    uses: ./.github/workflows/actualizacion.yml

  # ---------------------------------------------------------------------------
  # Las migraciones, sobre un emulador de verdad.
  #
  # Solo esta clase, no la suite de interfaz entera: una migracion equivocada
  # deja la app sin abrir en el telefono de quien actualiza y no hay forma de
  # arreglarlo desde fuera, asi que no puede quedar sin comprobar. Las pruebas
  # de pantalla dependen de animaciones y relojes, y su intermitencia no puede
  # ser lo que impida publicar una correccion.
  #
  # Mientras el esquema siga en 1 solo comprueba que 1.json describe una base
  # que Room acepta. Esta aqui desde antes de la primera Migration para que esa
  # no pueda llegar a una release sin pasar por el. EsquemaDeBaseTest vigila
  # ademas en la JVM que la cadena no tenga huecos. Ver docs/modelo-de-datos.md.
  # ---------------------------------------------------------------------------
  migraciones:
    name: Migraciones en emulador
    needs: etiqueta
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # La virtualizacion por hardware no viene activada en los runners de
      # Linux; sin esto el emulador arranca en modo software y tarda de mas.
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Correr MigracionesTest
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          # `lenient` por el ejecutor de pruebas en dispositivo (UTP): se
          # descarga solo con un emulador conectado y no esta en
          # gradle/verification-metadata.xml. Este job solo prueba; el APK que
          # se publica sale del job `publicar`, en estricto.
          script: >
            ./gradlew connectedDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.class=com.carlosalbertoxw.ollin.finanzas.db.MigracionesTest
            --dependency-verification=lenient
            --no-daemon

      - name: Guardar el informe
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: informe-migraciones
          path: app/build/reports/androidTests/
          retention-days: 14
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # El artefacto firmado y la release.
  # ---------------------------------------------------------------------------
  publicar:
    name: Compilar y publicar
    needs: [etiqueta, pruebas, migraciones, actualizacion]
    runs-on: ubuntu-latest
    timeout-minutes: 40

    permissions:
      contents: write
      # Los tres para atestar el APK y su SBOM: el token OIDC con el que
      # Sigstore emite el certificado, y guardar la atestacion en el repo.
      id-token: write
      attestations: write
      artifact-metadata: write

    # Los secretos de firma van en este environment y no en los del repositorio:
    # asi solo existen para este job, y con la regla de tags `v*` (y, si se
    # quiere, revision obligatoria) ningun otro flujo --ni un pull request que
    # toque un workflow-- puede leerlos. Si siguieran en el repositorio, esta
    # linea no protegeria nada. Ver docs/publicacion.md#los-secretos.
    environment: release

    env:
      VERSION: ${{ needs.etiqueta.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: notas-de-version

      # El almacen de claves viaja como secreto en base64 porque un secreto de
      # Actions es texto y un .jks es binario. Se escribe fuera del arbol de
      # trabajo para que no pueda acabar en un artefacto por descuido.
      #
      # Los cuatro secretos se comprueban aqui, juntos y antes de compilar. Un
      # secreto ausente es la cadena vacia, no un error: si se deja pasar, el
      # build tarda dos minutos en morir dentro de AGP con un NullPointer que
      # no nombra el secreto ni dice que falta uno. Y se listan todos los que
      # falten de una vez, para arreglarlos en un viaje y no en cuatro.
      - name: Restaurar el almacén de claves
        env:
          ALMACEN: ${{ secrets.OLLIN_FINANZAS_KEYSTORE_BASE64 }}
          OLLIN_FINANZAS_STORE_PASSWORD: ${{ secrets.OLLIN_FINANZAS_STORE_PASSWORD }}
          ALIAS: ${{ secrets.OLLIN_FINANZAS_KEY_ALIAS }}
          CLAVE: ${{ secrets.OLLIN_FINANZAS_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          faltan=()
          [ -n "${ALMACEN:-}" ] || faltan+=("OLLIN_FINANZAS_KEYSTORE_BASE64")
          [ -n "${OLLIN_FINANZAS_STORE_PASSWORD:-}" ] || faltan+=("OLLIN_FINANZAS_STORE_PASSWORD")
          [ -n "${ALIAS:-}" ] || faltan+=("OLLIN_FINANZAS_KEY_ALIAS")
          [ -n "${CLAVE:-}" ] || faltan+=("OLLIN_FINANZAS_KEY_PASSWORD")

          if [ ${#faltan[@]} -gt 0 ]; then
            echo "::error::Faltan estos secretos: ${faltan[*]}"
            echo "::error::Sin ellos el APK saldría sin firmar y no se instala en ningún teléfono."
            echo "::error::Van en Settings → Environments → release → Environment secrets, no en los"
            echo "::error::del repositorio, con el environment limitado a los tags v*. Los nombres van tal cual."
            echo "::error::Ver docs/publicacion.md#los-secretos."
            exit 1
          fi

          almacen="$RUNNER_TEMP/ollin-finanzas-release.jks"
          printf '%s' "$ALMACEN" | base64 --decode > "$almacen"

          # Que el archivo sea un almacen de verdad, que la contrasena lo abra y
          # que el alias exista: las tres cosas en un segundo, contra los dos
          # minutos que tarda R8 en llegar al momento de firmar y descubrirlo.
          # La contrasena va por `:env` y nunca por la linea de comandos.
          if ! keytool -list -keystore "$almacen" \
                 -storepass:env OLLIN_FINANZAS_STORE_PASSWORD \
                 -alias "$ALIAS" > /dev/null 2>&1; then
            echo "::error::El almacén no se pudo abrir con el alias '$ALIAS'."
            echo "::error::O el base64 no corresponde al .jks, o STORE_PASSWORD no es la suya,"
            echo "::error::o el alias está mal escrito. Compruébalo en local con:"
            echo "::error::  ./gradlew :app:signingReport"
            exit 1
          fi

          echo "Almacén restaurado y comprobado, alias '$ALIAS'."

      - name: Compilar el APK y el bundle
        env:
          OLLIN_FINANZAS_STORE_FILE: ${{ runner.temp }}/ollin-finanzas-release.jks
          OLLIN_FINANZAS_STORE_PASSWORD: ${{ secrets.OLLIN_FINANZAS_STORE_PASSWORD }}
          OLLIN_FINANZAS_KEY_ALIAS: ${{ secrets.OLLIN_FINANZAS_KEY_ALIAS }}
          OLLIN_FINANZAS_KEY_PASSWORD: ${{ secrets.OLLIN_FINANZAS_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease :app:cyclonedxDirectBom --no-daemon --stacktrace

      # Sin credenciales el build no falla, saca `app-release-unsigned.apk` y
      # sigue adelante. Es lo que se quiere al compilar en local; aqui seria un
      # desastre silencioso, asi que se comprueba la firma antes de publicar.
      - name: Comprobar que el APK va firmado
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk

          if [ ! -f "$apk" ]; then
            echo "::error::No hay app-release.apk. ¿Salió sin firmar?"
            ls -la app/build/outputs/apk/release/ || true
            exit 1
          fi

          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "$apk" | tee certificados.txt

          # Firmado no basta: tiene que ser con *la* llave. La huella esperada
          # vive en el README, que es contra lo que la gente compara al instalar.
          # Un APK firmado con otra --un almacen equivocado en los secretos, uno
          # de pruebas-- se instalaria limpio en un telefono nuevo y despues no
          # podria actualizar a nadie, o al reves.
          esperada=$(grep -oP 'SHA-256 del certificado de firma: `\K[0-9a-f]{64}' README.md || true)
          if [ -z "$esperada" ]; then
            echo "::error::El README no trae la línea 'SHA-256 del certificado de firma'."
            exit 1
          fi

          huellas=$(grep -oiP 'certificate SHA-256 digest: \K[0-9a-f]{64}' certificados.txt | sort -u)
          if [ "$huellas" != "$esperada" ]; then
            echo "::error::El APK va firmado con '${huellas:-nada}', y el README dice '$esperada'."
            exit 1
          fi
          echo "La firma coincide con la del README: $esperada"

          # Y se publica junto a las notas, por el mismo camino que el archivo.
          {
            echo
            echo "---"
            echo
            echo "SHA-256 del certificado de firma: \`$esperada\`"
            echo "(\`apksigner verify --print-certs\` tiene que mostrar la misma; ver el README)."
          } >> notas.md
          rm -f certificados.txt

      # Se adjuntan el APK y su SBOM. El .aab se compila —un fallo de bundling
      # es un fallo igual y conviene verlo aqui— pero no se publica: no se
      # instala en ningun telefono, solo sirve para subirlo a Play, y una
      # descarga que no hace lo que promete confunde a quien llega de fuera.
      #
      # El SBOM (CycloneDX) es el inventario de lo que viaja dentro de este APK.
      # Sale de la misma compilacion, asi que ante una alerta futura dice que
      # version exacta de cada biblioteca llevaba esta release.
      - name: Preparar la entrega
        run: |
          set -euo pipefail
          mkdir -p entrega
          cp app/build/outputs/apk/release/app-release.apk "entrega/ollin-finanzas-$VERSION.apk"
          cp app/build/reports/sbom/ollin-finanzas.cdx.json "entrega/ollin-finanzas-$VERSION.cdx.json"

          # La huella se publica junto al archivo para que cualquiera pueda
          # comprobar que lo que bajo es lo que salio de esta compilacion.
          ( cd entrega && sha256sum ./*.apk ./*.cdx.json > checksums.txt )
          cat entrega/checksums.txt

      # La firma dice quien firmo; la atestacion dice desde que commit y con
      # que flujo salio el binario, firmada por Sigstore con la identidad de
      # este workflow. Se comprueba con `gh attestation verify` (ver el README).
      # Va antes de crear la release: lo que se atesta es la huella del archivo,
      # y la release sube exactamente estos bytes.
      - name: Atestar la procedencia del APK
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: entrega/*.apk

      - name: Atestar el SBOM del APK
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: entrega/*.apk
          sbom-path: entrega/ollin-finanzas-${{ needs.etiqueta.outputs.version }}.cdx.json

      - name: Crear la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --title "Ollin Finanzas $VERSION" \
            --notes-file notas.md \
            --verify-tag \
            entrega/*

  # ---------------------------------------------------------------------------
  # Y el sitio, al final: le pregunta a GitHub por la release recien creada, le
  # saca la huella al APK publicado y reescribe el version.json que consultan
  # las instalaciones que ya estan por ahi.
  #
  # Se lanza sobre main en vez de invocarlo desde aqui, por dos razones que
  # apuntan al mismo sitio.
  #
  # La practica: el entorno github-pages solo admite despliegues desde la rama
  # por omision. Invocado desde aqui, el flujo corre en el ref de la etiqueta y
  # GitHub lo rechaza con "not allowed to deploy to github-pages".
  #
  # La de fondo: el contenido del sitio —el HTML, los estilos, los textos— debe
  # salir de main y no del arbol al que apunte una etiqueta. Si no, relanzar la
  # publicacion de una version vieja republicaria el sitio de entonces y se
  # llevaria por delante cualquier correccion posterior. Los datos de la
  # descarga no viajan por aqui: sitio.yml le pregunta a GitHub cual es la
  # ultima release, asi que lanzarlo sobre main publica exactamente lo mismo.
  # ---------------------------------------------------------------------------
  sitio:
    name: Lanzar el despliegue del sitio
    needs: publicar
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      actions: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Desplegar desde main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run sitio.yml --ref main
          echo "Despliegue lanzado. Corre aparte, aqui no se espera:"
          echo "  $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/workflows/sitio.yml"
