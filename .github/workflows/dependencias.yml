# Le dice a GitHub que dependencias trae de verdad el build de la app.
#
# El grafo de dependencias de GitHub lee el package-lock.json del sitio sin
# ayuda, pero no sabe resolver Gradle: ve el catalogo de versiones a medias y
# ninguna de las transitivas. Sin esto, una alerta de Dependabot sobre SQLite
# dentro de SQLCipher, o sobre algo que arrastra AndroidX, nunca llegaria.
#
# Solo corre sobre main: lo que importa es lo que se publica, y enviar el grafo
# pide permiso de escritura que un pull request no debe tener.
name: Grafo de dependencias

on:
  push:
    branches: [main]
    paths:
      - 'gradle/**'
      - '**/*.gradle.kts'
      - '.github/workflows/dependencias.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enviar:
    name: Enviar el grafo de Gradle
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/dependency-submission@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
