# Le dice a GitHub que dependencias trae de verdad el build de la app.
#
# El grafo de dependencias de GitHub lee el package-lock.json del sitio sin
# ayuda, pero no sabe resolver Gradle: ve el catalogo de versiones a medias y
# ninguna de las transitivas. Sin esto, una alerta de Dependabot sobre SQLite
# dentro de SQLCipher, o sobre algo que arrastra AndroidX, nunca llegaria.
#
# Solo corre sobre main: lo que importa es lo que se publica, y enviar el grafo
# pide permiso de escritura que un pull request no debe tener.
name: Grafo de dependencias

on:
  push:
    branches: [main]
    paths:
      - 'gradle/**'
      - '**/*.gradle.kts'
      - '.github/workflows/dependencias.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enviar:
    name: Enviar el grafo de Gradle
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      # `lenient` porque la accion inyecta su propio plugin de Gradle, que no esta
      # en gradle/verification-metadata.xml: con la verificacion en estricto
      # Gradle se negaria a cargarlo. Este job solo le cuenta a GitHub que hay
      # en el build; no compila ni publica nada.
      - uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          additional-arguments: --dependency-verification=lenient
