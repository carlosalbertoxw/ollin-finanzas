# Lo que tiene que pasar antes de que nada llegue a main, y antes de publicar.
#
# Se declara `workflow_call` para que el flujo de publicacion lo invoque tal
# cual en vez de copiar los pasos: una etiqueta no puede pasar por una
# comprobacion mas floja que un pull request cualquiera.
name: Pruebas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

# Empujar dos veces seguidas no deja dos compilaciones peleandose por el cache.
# En una etiqueta no se cancela nada: `github.ref` es unico por tag.
concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  app:
    name: App Android
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # JDK 21 para correr Gradle. Desde Gradle 9.8 y Kotlin 2.4 tambien sirve
      # uno mas nuevo, pero el 21 es LTS y es con el que se publica. El
      # `jvmTarget` del proyecto sigue siendo 17; son cosas distintas.
      - name: Preparar JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # Todo en una invocacion para que Gradle reutilice la configuracion y las
      # tareas comunes en vez de arrancar cinco veces.
      #
      #   licenseeAndroidRelease   que lo que viaja en el APK tenga una licencia
      #                            de la lista de app/build.gradle.kts
      #   testDebugUnitTest        las pruebas en la JVM, EsquemaDeBaseTest incluido
      #   lintDebug                falla la compilacion si Lint encuentra errores
      #   ktlintCheck              estilo de Kotlin; solo falla con infracciones
      #                            nuevas, las de antes estan en el baseline
      #   assembleDebugAndroidTest compila la suite instrumentada sin ejecutarla,
      #                            que es lo unico que se puede hacer sin emulador
      #   assembleRelease          R8 y shrink: rompe aqui, no al etiquetar
      - name: Pruebas, Lint y compilacion
        run: >
          ./gradlew
          licenseeAndroidRelease
          testDebugUnitTest
          lintDebug
          ktlintCheck
          assembleDebugAndroidTest
          assembleRelease
          --no-daemon --stacktrace

      - name: Guardar los informes
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: informes-app
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/reports/licensee/
          retention-days: 14
          if-no-files-found: ignore

  sitio:
    name: Sitio
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar
        working-directory: web
        run: npm ci

      # Las dependencias del sitio son solo de compilacion, pero corren en el
      # runner que lo despliega. Dependabot avisa por correo; esto lo hace
      # imposible de pasar por alto, porque un PR con una vulnerabilidad alta
      # conocida no queda en verde.
      - name: Auditar dependencias
        working-directory: web
        run: npm audit --audit-level=high

      # Compilar el sitio tambien valida el CHANGELOG: genera-version.mjs se
      # niega si no encuentra un encabezado `## [x.y.z]`, que es exactamente lo
      # que el build de la app necesita para saber su version.
      - name: Compilar
        working-directory: web
        run: npm run build

      # El version.json es un contrato con cada APK ya instalado, que trae
      # compilada su manera de leerlo (ComprobadorActualizaciones.lee y
      # DestinosPermitidos) y no se puede corregir desde fuera. Renombrar un
      # campo en genera-version.mjs, o mover la descarga fuera de las releases
      # del repositorio, apagaria el aviso de actualizacion en todos ellos sin
      # que fallara nada: aqui se comprueba que siga trayendo lo que la app acepta.
      - name: El version.json cumple con lo que lee la app
        working-directory: web
        run: |
          set -euo pipefail
          jq -e '
            (.version | type == "string" and test("^[0-9]+\\.[0-9]+\\.[0-9]+$")) and
            (.apk | type == "string" and startswith("https://github.com/carlosalbertoxw/ollin-finanzas/releases/")) and
            (.sitio | type == "string" and startswith("https://"))
          ' dist/version.json > /dev/null || {
            echo "::error::dist/version.json ya no trae version, apk y sitio como los lee la app."
            cat dist/version.json
            exit 1
          }
          echo "version.json en regla:"
          cat dist/version.json
